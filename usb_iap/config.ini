[device]
name = HALL_KEYBOARD
vid = 0x19F5
pid = 0x5760
usage_page = 0x4A53

[payload]
; Place APP1-linked firmware .bin here (same image as UART IAP).
bin_path = payload/firmware_factory.bin

[iap]
chunk_size = 128
; Wait ACK after each frame; page flash may need longer than idle 200ms.
ack_timeout_ms = 2000
ack_retries = 5
; Extra delay after ACK (ms). 0 = as fast as ACK allows.
gap_ms = 0
report_id_out = 0x51
report_id_in = 0x50
out_report_len = 128
in_report_len = 64
